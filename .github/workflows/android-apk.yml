name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decode release signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing required GitHub Secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/threadbrief-release.jks"

      - name: Build signed Android release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/threadbrief-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npm run android:sync
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-thread-brief-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk "release/TG帖子总结.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: "Android 自动构建 #${{ github.run_number }}"
          body: |
            本版本使用固定 Release 签名密钥构建，后续版本可直接覆盖更新。

            - 提交：`${{ github.sha }}`
            - 分支：`${{ github.ref_name }}`
            - versionCode：`${{ github.run_number }}`
            - 支持 Android 7.0（API 24）及更高版本
            - 首次打开后请在应用右上角配置 API Key、OpenAI Base URL 和模型名称
          prerelease: true
          draft: false
          files: release/TG帖子总结.apk
