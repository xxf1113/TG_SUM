apply plugin: 'com.android.application'def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { value -> value != null && !value.trim().isEmpty() }def buildingRelease = gradle.startParameter.taskNames.any { taskName -> taskName.toLowerCase(Locale.ROOT).contains('release') }if (buildingRelease && !hasReleaseSigning) {    throw new GradleException('Release signing is not configured. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')}android {    namespace = "com.threadbrief.app"    compileSdk = rootProject.ext.compileSdkVersion    defaultConfig {        applicationId "com.threadbrief.app"        minSdkVersion rootProject.ext.minSdkVersion        targetSdkVersion rootProject.ext.targetSdkVersion        versionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '2').toInteger()        versionName = (System.getenv('ANDROID_VERSION_NAME') ?: '1.0')        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"        aaptOptions {             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'        }    }    signingConfigs {        release {            if (hasReleaseSigning) {                storeFile file(releaseKeystorePath)                storePassword releaseKeystorePassword                keyAlias releaseKeyAlias                keyPassword releaseKeyPassword
